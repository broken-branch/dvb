[Service]
Slice=dvb.slice
Type=exec
User=dvb-worker
Group=dvb-worker
UMask=0002
ExecStart=/opt/dvb/current/dvb run exec %i
EnvironmentFile=/var/lib/dvb/work/%i/env
WorkingDirectory=/var/lib/dvb/work/%i
Environment=HOME=/var/lib/dvb/work/%i/home
# Hide sibling runs and every project's mirror and build cache; bind sources are
# resolved in the host namespace.
TemporaryFileSystem=/var/lib/dvb/work:ro /var/lib/dvb/mirrors:ro
BindPaths=/var/lib/dvb/work/%i
# The run's own project cache: the engine's cache link, followed on both sides,
# mounts it back at its own path under the hidden .cache. Login runs have none.
BindPaths=-/var/lib/dvb/work/%i/cache
# The run's own project mirror, read-only, the same way through the engine's
# mirror link. Login runs have none.
BindReadOnlyPaths=-/var/lib/dvb/work/%i/mirror
# Mount points cannot be replaced through the worker-writable run directory.
BindReadOnlyPaths=/var/lib/dvb/work/%i/env -/var/lib/dvb/work/%i/prompt.md
# Prevent same-UID access through another run's /proc/<pid>/{root,cwd,fd}.
PrivateUsers=yes
InaccessiblePaths=/var/lib/dvb/logins
ProtectHome=yes
PrivateTmp=yes
NoNewPrivileges=yes
# Runs do not share SysV IPC or POSIX message queues with the host or each other.
PrivateIPC=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
MemoryMax=8G
LimitFSIZE=infinity
KillMode=control-group
TimeoutStopSec=20
