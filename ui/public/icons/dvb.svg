<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- The letters blur below 48 px, so smaller renders draw a ring and meter on a pixel grid. -->
  <style>
    .px16, .px32 { display: none }
    @media (max-width: 40px) { .full { display: none } .px32 { display: inline } }
    @media (max-width: 24px) { .px32 { display: none } .px16 { display: inline } }
  </style>
  <defs>
