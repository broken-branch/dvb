name: cache
# PR runs can restore caches saved on main but not caches saved by other PRs, and
# ci.yml no longer runs on main. Each leg saves the rust-cache key its ci.yml job
# restores (shared-key = that job's id; a job's default key adds its id) and builds
# only when that key is missing. One leg also saves the npm cache.
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency: cache-${{ github.ref }}
# The rust-cache key hashes CARGO* variables: keep these equal to ci.yml's.
env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
jobs:
  cache:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        job: [rust, contracts, e2e, upgrade]
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup toolchain install
      - id: rust-cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.job }}
          lookup-only: true
      - name: Build the dependencies the ${{ matrix.job }} job builds
        if: steps.rust-cache.outputs.cache-hit != 'true'
        env:
          JOB: ${{ matrix.job }}
        run: |
          case "$JOB" in
            rust)
              cargo clippy --locked --workspace --all-targets
              cargo build --locked --workspace
              cargo test --locked --workspace --no-run ;;
            contracts)
              cargo build --locked -p dvb-engine --bin openapi
              cargo build --locked -p dvb-core --bin verdict-schema --bin wording ;;
            e2e | upgrade)
              cargo build --locked -p dvb ;;
          esac
      - id: node
        if: matrix.job == 'rust'
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Fill the npm cache
        if: matrix.job == 'rust' && steps.node.outputs.cache-hit != 'true'
        working-directory: ui
        run: npm ci
