[package]
name = "dvb-cli"
description = "The owner verbs on the command line."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
bytes = "1.12.1"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive", "env"] }
dvb-engine = { version = "0.1.0", path = "../dvb-engine" }
dvb-core = { version = "0.1.0", path = "../dvb-core" }
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_urlencoded = "0.7.1"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "net", "macros", "io-util", "time"] }

[dev-dependencies]
futures-util = "0.3.32"
axum = "0.8.9"
dvb-forge = { version = "0.1.0", path = "../dvb-forge" }
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["test-util"] }
