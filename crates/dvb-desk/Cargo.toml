[package]
name = "dvb-desk"
description = "The desk: serves the app, proxies the API, notifications."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
axum = "0.8.9"
dvb-cli = { version = "0.1.0", path = "../dvb-cli" }
dvb-core = { version = "0.1.0", path = "../dvb-core" }
hyper = "1.12.0"
toml = "1.1.8"
futures-util = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
zbus = { version = "6.0.0", default-features = false, features = ["tokio", "proxy", "tracing"] }
rust-embed = { version = "8.13.0", features = ["debug-embed"] }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "net", "macros", "time", "sync", "fs"] }

[dev-dependencies]
tempfile = "3.27.0"
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
