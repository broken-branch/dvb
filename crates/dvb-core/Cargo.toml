[package]
name = "dvb-core"
description = "The contracts: events, task states, refusals, API types and traits."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
tempfile = "3.27.0"
async-trait = "0.1.92"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
utoipa = "6.0.0"

thiserror = "2.0.18"
tokio = { version = "1.53.3", features = ["process", "io-util", "rt", "macros"] }
rustix = { version = "1.1.5", features = ["process"] }

[dev-dependencies]
proptest = "1.12.0"
proptest-state-machine = "0.9.0"
