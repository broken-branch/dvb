[package]
name = "dvb-forge"
description = "The forge: GitHub and the Fake forge, behind the Forge trait."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
http = "1.5.0"
http-body-util = "0.1.5"
bytes = "1.12.1"
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
async-trait = "0.1.92"
dvb-core = { version = "0.1.0", path = "../dvb-core" }
octocrab = { version = "0.54.4", default-features = false, features = ["follow-redirect", "retry", "rustls", "timeout", "tracing", "default-client", "rustls-ring", "jwt-aws-lc-rs"] }
jsonwebtoken = { version = "10.4.0", default-features = false, features = ["use_pem", "aws_lc_rs"] }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
tokio = { version = "1.53.3", features = ["rt", "process", "sync"] }
percent-encoding = "2.3.2"

tempfile = "3.27.0"

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
tokio = { version = "1.53.3", features = ["macros", "rt", "test-util"] }
wiremock = "0.6.5"
