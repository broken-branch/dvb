[package]
name = "dvb-run"
description = "The run side: prepare, preflight, exec, collect; the providers."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
dvb-cli = { version = "0.1.0", path = "../dvb-cli" }
dvb-core = { version = "0.1.0", path = "../dvb-core" }
dvb-forge = { version = "0.1.0", path = "../dvb-forge" }
rustix = { version = "1.1.5", features = ["fs", "process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt", "net", "time", "signal"] }

[dev-dependencies]
axum = "0.8.9"
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["macros", "rt", "sync"] }
